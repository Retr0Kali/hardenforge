- id: SH-LNX-FS-002
  title: /etc/shadow permissions are restricted
  description: /etc/shadow permissions are restricted.
  platforms:
  - linux
  severity: high
  status: approved
  profile: L1
  provenance: *id001
  check:
    type: file_permission
    params:
      path: /etc/shadow
      max_mode: '0640'
      owner_uid: 0
      missing_file: fail
  remediation: chown root:root /etc/shadow; chmod 0640 /etc/shadow
  rollback: Restore the pre-change value/file from your backup.
  impact: ''
  requires_privilege: true
