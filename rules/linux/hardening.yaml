- id: SH-LNX-SSH-010
  title: SSH rejects empty passwords
  description: SSH rejects empty passwords.
  platforms:
  - linux
  severity: high
  status: approved
  profile: L1
  provenance: *id001
  check:
    type: config_kv
    params:
      path: /etc/ssh/sshd_config
      key: PermitEmptyPasswords
      op: in
      value:
      - 'no'
      default: 'no'
      stop_at_regex: ^match\b
      missing_file: not_applicable
  remediation: Set 'PermitEmptyPasswords no' in sshd_config, validate with 'sshd -t', reload sshd. Keep an existing session open while testing.
  rollback: Restore the pre-change value/file from your backup.
  impact: Wrong values can lock you out of SSH.
  requires_privilege: true
