- id: SH-LNX-KRN-002
  title: ICMP redirects are not accepted
  description: ICMP redirects are not accepted.
  platforms:
  - linux
  severity: medium
  status: approved
  profile: L1
  provenance: &id001
    kind: community
    source: sentinel-examples
    version: '0.1'
  check:
    type: sysctl
    params:
      key: net.ipv4.conf.all.accept_redirects
      value: '0'
      op: eq
  remediation: Set net.ipv4.conf.all.accept_redirects = 0 in a file under /etc/sysctl.d/ and run 'sysctl --system'.
  rollback: Restore the pre-change value/file from your backup.
  impact: May affect routing/NAT hosts.
  requires_privilege: true
